    <text x="28" y="48" fill="#f9a8d4" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700">DRAM MODEL</text>
    <g transform="translate(30 78)" fill="#312e81" stroke="#a5b4fc"><rect width="76" height="50" rx="7"/><rect x="98" width="76" height="50" rx="7"/><rect y="68" width="76" height="50" rx="7"/><rect x="98" y="68" width="76" height="50" rx="7"/></g>
    <text x="28" y="218" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="16">HBM3 · DDR4 · DDR5</text>
