    <text x="0" y="78" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="21">large-granularity ECC / EDC research prototype</text>
    <g transform="translate(0 126)">
      <rect width="390" height="216" rx="22" fill="#0b1728" stroke="#22d3ee" stroke-width="2"/>
      <text x="28" y="46" fill="#67e8f9" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">MEMORY REQUEST</text>
      <g transform="translate(30 78)" fill="#172554" stroke="#60a5fa" stroke-width="2">
        <rect width="64" height="52" rx="8"/><rect x="76" width="64" height="52" rx="8"/><rect x="152" width="64" height="52" rx="8"/><rect x="228" width="64" height="52" rx="8"/><rect x="304" width="28" height="52" rx="8"/>
      </g>
      <text x="28" y="170" fill="#94a3b8" font-family="Consolas,monospace" font-size="17">address · data · request type</text>
    </g>
  </g>
  <path d="M505 325H590" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/><path d="M570 302L596 325L570 348" fill="none" stroke="#818cf8" stroke-width="8" stroke-linecap="round"/>
  <g transform="translate(625 112)">
    <rect width="344" height="326" rx="26" fill="#0b1728" stroke="#818cf8" stroke-width="2"/>
    <text x="30" y="50" fill="#c4b5fd" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">CONTROLLER PLUGIN</text>
    <g transform="translate(30 84)" font-family="Segoe UI,Arial,sans-serif">
      <rect width="284" height="54" rx="12" fill="#155e75"/><text x="22" y="35" fill="#ecfeff" font-size="18" font-weight="700">EDC · detect</text>
      <rect y="72" width="284" height="54" rx="12" fill="#3730a3"/><text x="22" y="107" fill="#eef2ff" font-size="18" font-weight="700">ECC · emulate correction</text>
      <rect y="144" width="284" height="54" rx="12" fill="#831843"/><text x="22" y="179" fill="#fdf2f8" font-size="18" font-weight="700">inject · measure · report</text>
    </g>
    <text x="30" y="300" fill="#94a3b8" font-family="Consolas,monospace" font-size="16">ECCPlugin::update()</text>
  </g>
  <path d="M1002 325H1082" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/><path d="M1062 302L1088 325L1062 348" fill="none" stroke="#f472b6" stroke-width="8" stroke-linecap="round"/>
  <g transform="translate(1120 147)">
