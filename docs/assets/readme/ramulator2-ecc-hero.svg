  <text x="720" y="520" text-anchor="middle" fill="#dbeafe" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="650" letter-spacing="2">REQUEST → DETECT → CORRECT → SIMULATE</text>
</svg>
