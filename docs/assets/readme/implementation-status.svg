<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Implementation evidence matrix</title>
  <desc id="desc">A concise status view of implemented, simplified, conceptual, and blocked capabilities found during repository audit</desc>
  <rect width="1200" height="520" rx="28" fill="#0b1220"/>
  <text x="60" y="62" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">Implementation evidence · 2026-08-24</text>
  <text x="60" y="96" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="17">Repository code and isolated fresh-clone checks</text>
  <g font-family="Segoe UI,Arial,sans-serif">
    <g transform="translate(60 132)"><rect width="1080" height="66" rx="14" fill="#0f2f2a"/><rect width="188" height="66" rx="14" fill="#0f766e"/><text x="24" y="42" fill="#ecfeff" font-size="19" font-weight="700">IMPLEMENTED</text><text x="220" y="42" fill="#ccfbf1" font-size="18">CRC32 / CRC64 / checksum · error injection · six registered counters</text></g>
    <g transform="translate(60 214)"><rect width="1080" height="66" rx="14" fill="#2f2910"/><rect width="188" height="66" rx="14" fill="#a16207"/><text x="24" y="42" fill="#fffbeb" font-size="19" font-weight="700">SIMPLIFIED</text><text x="220" y="42" fill="#fef3c7" font-size="18">Hamming and BCH parity mocks · RS path not tied to input payload</text></g>
    <g transform="translate(60 296)"><rect width="1080" height="66" rx="14" fill="#2d1931"/><rect width="188" height="66" rx="14" fill="#a21caf"/><text x="24" y="42" fill="#fdf4ff" font-size="19" font-weight="700">CONCEPTUAL</text><text x="220" y="42" fill="#fae8ff" font-size="18">dynamic protection policy · latency and cost formulas · retry and RAID recovery</text></g>
    <g transform="translate(60 378)"><rect width="1080" height="66" rx="14" fill="#351519"/><rect width="188" height="66" rx="14" fill="#be123c"/><text x="24" y="42" fill="#fff1f2" font-size="19" font-weight="700">BLOCKED</text><text x="220" y="42" fill="#ffe4e6" font-size="18">fresh build · missing ext/reed_solomon sources in the repository</text></g>
  </g>
  <text x="60" y="486" fill="#64748b" font-family="Segoe UI,Arial,sans-serif" font-size="15">Status labels describe committed evidence, not intended future behavior</text>
</svg>
